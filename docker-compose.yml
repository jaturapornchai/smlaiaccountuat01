# OpenHands Docker Compose สำหรับรัน OpenHands Agent Server ภายในเครื่อง
# เอกสารอ้างอิง: https://github.com/OpenHands/OpenHands
services:
  openhands:
    image: docker.all-hands.dev/all-hands-ai/openhands:latest
    container_name: openhands-server
    restart: unless-stopped
    environment:
      - PORT=3000
      - LLM_MODEL=${LLM_MODEL:-anthropic/claude-3-5-sonnet-20241022}
      - LLM_API_KEY=${LLM_API_KEY:-your-api-key-here}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - WORKSPACE_BASE=${WORKSPACE_BASE:-./workspace}
      - RUNTIME=docker
      - SANDBOX_USER_ID=1000
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspace:/opt/workspace_base
      - ./openhands_state:/.openhands-state
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  openhands_state:
